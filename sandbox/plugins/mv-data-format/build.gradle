/*
 * Unified MV plugin: consolidates the former mv-data-format, mv-pull-engine,
 * and mv-state-format modules into a single deployable unit. The generic SPI
 * interfaces (DerivedDataFormat, DerivedSourceReader, etc.) remain in the
 * server module; only MV-specific implementations live here.
 */
opensearchplugin {
  description = 'POC: unified materialized-view plugin — data format, pull engine, and state format.'
  classname = 'org.opensearch.mv.MVDataFormatPlugin'
  extendedPlugins = ['arrow-base', 'composite-engine']
}

java { sourceCompatibility = JavaVersion.toVersion(25); targetCompatibility = JavaVersion.toVersion(25) }

dependencies {
  compileOnly project(':plugins:arrow-base')

  // dataformat-native must BUNDLE into the plugin zip: NativeLibraryLoader/
  // NativeCall are used from this plugin's own classloader. NOTE: compileOnly
  // deps on OTHER PLUGIN projects poison the bundler — everything on their
  // classpaths is treated as provided and silently excluded from this zip
  // (that's how dataformat-native + arrow-c-data went missing and real nodes
  // died with NoClassDefFoundError at first write). Keep plugin-project deps
  // OUT of the main scope; ITs may depend on them in their own scope.
  implementation project(':sandbox:libs:dataformat-native')

  compileOnly 'org.checkerframework:checker-qual:3.43.0'
  implementation "org.apache.arrow:arrow-vector:${versions.arrow}"
  implementation "org.apache.arrow:arrow-memory-core:${versions.arrow}"
  implementation "org.apache.arrow:arrow-c-data:${versions.arrow}"
  implementation "org.apache.arrow:arrow-format:${versions.arrow}"
  implementation "com.google.flatbuffers:flatbuffers-java:${versions.flatbuffers}"
  implementation "org.slf4j:slf4j-api:${versions.slf4j}"
}

apply plugin: 'opensearch.internal-cluster-test'

tasks.named('compileInternalClusterTestJava').configure {
  sourceCompatibility = JavaVersion.toVersion(25)
  targetCompatibility = JavaVersion.toVersion(25)
}

dependencies {
  // IT-scope only (does NOT leak into the plugin zip): the in-JVM test
  // cluster instantiates the sibling plugins directly.
  internalClusterTestImplementation project(':sandbox:plugins:analytics-engine')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-backend-datafusion')
  internalClusterTestImplementation project(':sandbox:plugins:parquet-data-format')
  internalClusterTestImplementation project(':sandbox:plugins:composite-engine')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-backend-lucene')
  internalClusterTestImplementation project(':sandbox:libs:analytics-framework')
  internalClusterTestImplementation project(':sandbox:libs:dataformat-native')
  internalClusterTestImplementation project(':modules:transport-netty4')
  internalClusterTestImplementation project(':plugins:arrow-base')
  internalClusterTestImplementation project(':plugins:arrow-flight-rpc')
}

tasks.named('internalClusterTest').configure {
  jvmArgs += [
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED'
  ]
  systemProperty 'io.netty.allocator.numDirectArenas', '1'
  systemProperty 'io.netty.noUnsafe', 'false'
  systemProperty 'io.netty.tryUnsafe', 'true'
  systemProperty 'io.netty.tryReflectionSetAccessible', 'true'
  systemProperty 'opensearch.set.netty.runtime.available.processors', 'false'
  systemProperty 'native.lib.path', project(':sandbox:libs:dataformat-native').ext.nativeLibPath.absolutePath
  dependsOn ':sandbox:libs:dataformat-native:buildRustLibrary'
}

configurations.matching { it.name.startsWith('internalClusterTest') }.configureEach {
  resolutionStrategy {
    force 'com.google.guava:guava:33.3.1-jre'
    force 'com.google.guava:failureaccess:1.0.2'
  }
}

test {
  jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

// Arrow uses Unsafe internally for aligned off-heap vector buffers. This is the
// same audited exception used by parquet-data-format.
tasks.named('thirdPartyAudit').configure {
  ignoreViolations(
    'org.apache.arrow.memory.util.MemoryUtil',
    'org.apache.arrow.memory.util.MemoryUtil$1'
  )
}
