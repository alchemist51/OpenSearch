/*
 * MV definition-layer plugin: stores MV definitions as JSON in
 * IndexMetadata.customData on BOTH source and target indices, written
 * atomically in ONE ClusterStateUpdateTask. No native code; no pull/ship/merge.
 */
opensearchplugin {
  description = 'POC: materialized-view definition layer — definition storage, compilation, and target creation.'
  classname = 'org.opensearch.mv.MVEnginePlugin'
}

java { sourceCompatibility = JavaVersion.toVersion(25); targetCompatibility = JavaVersion.toVersion(25) }

dependencies {
  compileOnly project(':server')
  compileOnly "org.apache.arrow:arrow-vector:${versions.arrow}"
  compileOnly "org.apache.arrow:arrow-memory-core:${versions.arrow}"
  implementation "org.apache.arrow:arrow-c-data:${versions.arrow}"
  testImplementation project(':test:framework')
}

tasks.named('compileTestJava').configure {
  sourceCompatibility = JavaVersion.toVersion(25)
  targetCompatibility = JavaVersion.toVersion(25)
}

tasks.withType(JavaCompile).configureEach {
  // Arrow references Jackson/checkerframework annotations not on classpath — harmless warnings
  options.compilerArgs -= '-Werror'
}
