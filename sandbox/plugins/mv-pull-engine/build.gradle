/*
 * POC (pull-model v2, Track A): MaterializedViewEngine — an IngestionEngine-
 * shaped engine whose "stream" is the SOURCE index's remote segment store.
 * The source is completely unaware; the MV polls published metadata
 * generations, folds the (W, C] seq-no delta, and commits the watermark
 * atomically with the folded data.
 */
opensearchplugin {
  description = 'POC: pull-based materialized view engine polling the source remote segment store.'
  classname = 'org.opensearch.mvpull.MVPullEnginePlugin'
  // MVNativeBridge (DataFusion fold) + arrow classes resolve from
  // mv-data-format's classloader at runtime (mv-state-format pattern).
  extendedPlugins = ['mv-data-format', 'mv-state-format']
}

apply plugin: 'opensearch.internal-cluster-test'

dependencies {
  compileOnly project(':sandbox:plugins:mv-data-format')
  compileOnly 'org.checkerframework:checker-qual:3.43.0'
  compileOnly "org.apache.arrow:arrow-vector:${versions.arrow}"
  compileOnly "org.apache.arrow:arrow-memory-core:${versions.arrow}"
  compileOnly "org.apache.arrow:arrow-c-data:${versions.arrow}"

  // IT-scope only: the in-JVM test cluster instantiates the composite stack directly.
  internalClusterTestImplementation project(':sandbox:plugins:mv-data-format')
  internalClusterTestImplementation project(':sandbox:plugins:mv-state-format')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-engine')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-backend-datafusion')
  internalClusterTestImplementation project(':sandbox:plugins:parquet-data-format')
  internalClusterTestImplementation project(':sandbox:plugins:composite-engine')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-backend-lucene')
  internalClusterTestImplementation project(':sandbox:libs:analytics-framework')
  internalClusterTestImplementation project(':sandbox:libs:dataformat-native')
  internalClusterTestImplementation project(':modules:transport-netty4')
  internalClusterTestImplementation project(':plugins:arrow-base')
  internalClusterTestImplementation project(':plugins:arrow-flight-rpc')
}

tasks.named('compileInternalClusterTestJava').configure {
  sourceCompatibility = JavaVersion.toVersion(25)
  targetCompatibility = JavaVersion.toVersion(25)
}

tasks.named('internalClusterTest').configure {
  jvmArgs += [
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED'
  ]
  systemProperty 'io.netty.allocator.numDirectArenas', '1'
  systemProperty 'io.netty.noUnsafe', 'false'
  systemProperty 'io.netty.tryUnsafe', 'true'
  systemProperty 'io.netty.tryReflectionSetAccessible', 'true'
  systemProperty 'opensearch.set.netty.runtime.available.processors', 'false'
  systemProperty 'native.lib.path', project(':sandbox:libs:dataformat-native').ext.nativeLibPath.absolutePath
  dependsOn ':sandbox:libs:dataformat-native:buildRustLibrary'
}

java { sourceCompatibility = JavaVersion.toVersion(25); targetCompatibility = JavaVersion.toVersion(25) }

configurations.matching { it.name.startsWith('internalClusterTest') }.configureEach {
  resolutionStrategy {
    force 'com.google.guava:guava:33.3.1-jre'
    force 'com.google.guava:failureaccess:1.0.2'
  }
}
